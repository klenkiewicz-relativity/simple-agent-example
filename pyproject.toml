[project]
name = "deepagents-in-200-lines"
version = "0.1.0"
description = "An inspectable model/tool loop with an event log, not a graph runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langchain-core>=1.0,<2"]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0,<2"]
compat = ["langchain>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
